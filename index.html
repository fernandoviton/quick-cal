<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:,">
    <title>Quick Cal</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="shared/common.css">
    <link rel="stylesheet" href="shared/header.css">

    <!-- App styles -->
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <!-- No login page: access is by secret link (see README "Privacy model") -->
    <div id="app-container">
        <div id="header"></div>
        <div id="savingIndicator" class="saving-indicator">Saving...</div>
        <div id="app"></div>
    </div>

    <!-- Supabase CDN, pinned with SRI since it runs on pages holding the calendar secret
         (graceful no-op if offline in mock mode) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
            integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
            crossorigin="anonymous"></script>

    <!-- Shared infrastructure -->
    <script src="shared/version.js"></script>
    <script src="shared/config-loader.js"></script>
    <script src="shared/supabase-client.js"></script>
    <script src="shared/utils.js"></script>

    <!-- App -->
    <script src="cal-util.js"></script>
    <script src="cal-api.js"></script>
    <script src="app.js"></script>

    <script>
        App.init(document.getElementById('header'), document.getElementById('app'));
    </script>
</body>
</html>
